[project]
name = "clicknglide-mcp"
version = "0.1.0"
description = "Unofficial local MCP server (stdio) for the Click n' Glide gliding club planning tool"
license = { text = "MIT" }
authors = [{ name = "Nicolas Massart" }]
requires-python = ">=3.11"
dependencies = ["mcp>=1.10,<2", "httpx>=0.27", "playwright>=1.45"]

[project.scripts]
clicknglide-mcp = "clicknglide_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clicknglide_mcp"]
